name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Engine tests (SSTP / PPP / MS-CHAPv2)
        run: |
          python -m pip install cryptography
          sh engine-tests/run.sh

      - name: Build debug APK (test ads)
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PickixoVPN-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PickixoVPN-debug-apk
          path: PickixoVPN-debug.apk

      - name: Publish as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pickixo VPN test build ${{ github.run_number }}
          prerelease: true
          files: PickixoVPN-debug.apk
